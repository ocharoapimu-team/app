<!-- Country profile page body. build_situation.py wraps this in the masthead, nav and footer of
     situation_template.html (so styles stay single-sourced) and writes one page per profiles/<ISO>.json. -->
<main class="wrap">
  <article class="profile" id="profile"></article>
  <nav class="p-pager" id="pager" aria-label="Other country profiles"></nav>
</main>
<!--__FOOTER__-->
<script id="profile-data" type="application/json">/*__PROFILE__*/</script>
<script id="geo" type="application/json">/*__GEO__*/</script>
<script id="profile-list" type="application/json">/*__LIST__*/</script>
<script>
const WIKI='../wiki/index.html#/note/';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const p=JSON.parse($('#profile-data').textContent), LIST=JSON.parse($('#profile-list').textContent);
const SECTOR_ICON=s=>{ s=s.toLowerCase(); if(s.includes('food'))return 'Food-Security'; if(s.includes('water')||s.includes('wash'))return 'Water-source'; if(s.includes('nutri'))return 'Nutrition'; if(s.includes('health'))return 'Health'; if(s.includes('educ'))return 'Education'; if(s.includes('agri'))return 'Agriculture'; if(s.includes('fish'))return 'Fishery'; if(s.includes('liveli'))return 'Livelihood'; if(s.includes('protect'))return 'Protection'; if(s.includes('econ')||s.includes('price'))return 'Trade-and-market'; if(s.includes('displac'))return 'Internally-displaced'; if(s.includes('air')||s.includes('haze'))return 'Respiratory'; return 'Report'; };
const ACTOR_ICON=a=>{ a=a.toLowerCase(); if(a.includes('gov'))return 'Government-office'; if(a.includes('financ')||a.includes('anticip'))return 'Anticipatory-action'; return 'Coordination'; };
const fmtD=iso=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?`${+m[3]} ${['January','February','March','April','May','June','July','August','September','October','November','December'][+m[2]-1]} ${m[1]}`:(iso||''); };

/* ---- Country map: OCHA ROAP Mapbox basemap with the UN boundary layers; SVG locator if Mapbox can't load ---- */
const GEO=JSON.parse($('#geo').textContent);
const STYLE='mapbox://styles/ocha-roap/cmclpivue001g01shfvc1e21s';
const TOKEN='pk.eyJ1Ijoib2NoYS1yb2FwIiwiYSI6ImNrZXRhemIzMDIyZTEyeG85cXU1bGF1a2gifQ.9qTpr3IkhjPORrgGw8UEIg';
function bbox(iso){
  let x0=999,x1=-999,y0=999,y1=-999;
  GEO.adm0.features.filter(x=>x.properties.iso===iso).forEach(ft=>ft.geometry.coordinates.forEach(pl=>pl[0].forEach(([lo,la])=>{ x0=Math.min(x0,lo);x1=Math.max(x1,lo);y0=Math.min(y0,la);y1=Math.max(y1,la); })));
  return [[x0,y0],[x1,y1]];
}
function svgLocator(iso){
  const f=GEO.adm0.features.filter(x=>x.properties.iso===iso); if(!f.length) return '';
  let [[x0,y0],[x1,y1]]=bbox(iso); let w=x1-x0,h=y1-y0; const pad=Math.max(w,h)*0.35+1; x0-=pad;x1+=pad;y0-=pad;y1+=pad; w=x1-x0; h=y1-y0;
  const box=$('#pfallback').getBoundingClientRect(), W=Math.round(box.width)||400, H=Math.round(box.height)||340;
  const kx=Math.cos(((y0+y1)/2)*Math.PI/180), sc=Math.min(W/(w*kx),H/h), ox=(W-w*kx*sc)/2, oy=(H-h*sc)/2;
  const P2=(lo,la)=>[(ox+(lo-x0)*kx*sc).toFixed(1),(oy+(y1-la)*sc).toFixed(1)];
  const path=ft=>ft.geometry.coordinates.map(pl=>'M'+pl[0].map(c=>P2(c[0],c[1]).join(',')).join('L')+'Z').join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Locator map of ${esc(f[0].properties.name)}">${GEO.adm0.features.filter(ft=>ft.properties.iso!==iso).map(ft=>`<path d="${path(ft)}" fill="#e5e5e5" stroke="#737373" stroke-width=".5"/>`).join('')}${GEO.unsettled.features.map(ft=>`<path d="${path(ft)}" fill="#f2f2f2" stroke="#737373" stroke-width=".5" stroke-dasharray="2 2"/>`).join('')}${f.map(ft=>`<path d="${path(ft)}" fill="#e5e5e5" stroke="#404040" stroke-width="1"/>`).join('')}</svg>`;
}
let mapDone=false;
function fallback(){ if(mapDone) return; mapDone=true; const g=$('#pmap'); if(g) g.style.display='none'; const fb=$('#pfallback'); fb.style.display='flex'; fb.innerHTML=svgLocator(p.iso); }
function initMap(){
  if(!window.mapboxgl) return fallback();
  let map;
  try{
    mapboxgl.accessToken=TOKEN;
    map=new mapboxgl.Map({container:'pmap',style:STYLE,bounds:bbox(p.iso),fitBoundsOptions:{padding:48,maxZoom:7},attributionControl:false,cooperativeGestures:true,preserveDrawingBuffer:true,minZoom:2,maxZoom:10,dragRotate:false,pitchWithRotate:false});
  }catch(err){ console.error('mapbox init failed',err); return fallback(); }
  map.addControl(new mapboxgl.AttributionControl({compact:true,customAttribution:'© Mapbox © OpenStreetMap'}),'bottom-right');
  map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-right');
  const timer=setTimeout(()=>{ if(!mapDone) fallback(); },9000);
  map.on('error',e=>{ const msg=e&&e.error?String(e.error.message||e.error):''; if(/token|401|403|Failed to fetch|NetworkError|WebGL/i.test(msg)&&!mapDone){ clearTimeout(timer); fallback(); } });
  map.on('load',()=>{
    clearTimeout(timer); mapDone=true;
    const refit=()=>{ map.resize(); map.fitBounds(bbox(p.iso),{padding:48,maxZoom:7,duration:0}); };
    refit(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(refit); window.addEventListener('load',refit);
    const firstSymbol=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
    map.addSource('adm0',{type:'geojson',data:GEO.adm0});
    map.addSource('uns',{type:'geojson',data:GEO.unsettled});
    map.addSource('disp',{type:'geojson',data:GEO.disputed});
    map.addLayer({id:'adm0-line',type:'line',source:'adm0',paint:{'line-color':'#737373','line-width':0.6}},firstSymbol);
    map.addLayer({id:'uns-fill',type:'fill',source:'uns',paint:{'fill-color':'#f2f2f2','fill-opacity':0.9}},firstSymbol);
    map.addLayer({id:'uns-line',type:'line',source:'uns',paint:{'line-color':'#737373','line-width':0.6,'line-dasharray':[2,2]}},firstSymbol);
    map.addLayer({id:'disp-line',type:'line',source:'disp',paint:{'line-color':'#737373','line-width':1.2,'line-dasharray':[3,2]}},firstSymbol);
    map.addLayer({id:'ctry-line',type:'line',source:'adm0',filter:['==',['get','iso'],p.iso],paint:{'line-color':'#404040','line-width':1.4}},firstSymbol);
  });
}

const c=p.classification||{};
const pc=(k,v,cls)=>v?`<span class="pc ${cls||''}"><b>${k}</b>${esc(v)}</span>`:'';
$('#profile').innerHTML=`
<div class="p-head"><div>
  <p class="p-headline">${esc(p.headline)}</p>
  <div class="p-class">${pc('Snapshot tier',c.tier,'t1')}${pc('Risk pathway',c.pathway)}${pc('Climate hotspot',c.climate)}${pc('3FS exposure',c.three_fs)}${pc('IASC ENSO Cell',c.iasc)}</div>
  ${(c.other_lists||[]).length?`<details class="p-also"><summary>Also named in ${c.other_lists.length} other agency lists</summary><ul>${c.other_lists.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}
  <div class="p-actions"><button type="button" id="p-print">${icon('Print')} Print profile</button>${(p.wiki_notes||[]).length?`<a href="${WIKI+p.wiki_notes[0]}">${icon('Document')} Wiki note</a>`:''}<a href="../index.html#countries">${icon('Map')} Regional overview</a></div>
  ${(p.key_figures||[]).length?`<div class="p-figs">${p.key_figures.map(f=>`<div class="f${f.critical?' crit':''}"><div class="v">${esc(f.value)}${f.unit?`<span class="u">${esc(f.unit)}</span>`:''}</div><div class="l">${esc(f.label)}</div><div class="s">${esc(f.source)}</div></div>`).join('')}</div>`:''}
</div><div class="p-mapcol"><div class="p-locator" id="plocator"><div id="pmap" role="region" aria-label="Map of ${esc(p.name)}"></div><div id="pfallback"></div></div><div class="p-locator-cap">Basemap: OCHA ROAP (Mapbox). Boundaries: UN OCHA ROAP / UN Geospatial, via HDX. The boundaries and names shown and the designations used on this map do not imply official endorsement or acceptance by the United Nations.</div></div></div>
<div class="p-body"><div>
  ${(p.hazard_outlook||[]).length?`<section class="p-block"><h2 class="p-h">${icon('Calendar')}Hazard outlook</h2><div class="p-outlook">${p.hazard_outlook.map(h=>`<div><b>${esc(h.window)}</b>${esc(h.text)}</div>`).join('')}</div></section>`:''}
  ${(p.impacts||[]).length?`<section class="p-block"><h2 class="p-h">${icon('People-affected')}Humanitarian impacts by sector</h2><div class="p-sectors">${p.impacts.map(s=>`<div class="p-sector"><div class="sh">${icon(SECTOR_ICON(s.sector))}${esc(s.sector)}</div><ul>${s.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>`:''}
  ${(p.timeline||[]).length?`<section class="p-block"><h2 class="p-h">${icon('Monitoring')}What has happened</h2><ul class="p-tl">${p.timeline.map(t=>`<li><span class="d">${esc(t.label||fmtD(t.date))}</span>${esc(t.event)}${t.source?` <span class="src">— ${esc(t.source)}</span>`:''}</li>`).join('')}</ul></section>`:''}
</div><div class="p-side">
  ${(p.response||[]).length?`<section class="p-block"><h2 class="p-h">${icon('Response')}Response and preparedness</h2>${p.response.map(r=>`<div class="p-resp"><div class="ra">${icon(ACTOR_ICON(r.actor))}${esc(r.actor)}</div><ul>${r.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</section>`:''}
  ${(p.history||[]).length?`<section class="p-block"><h2 class="p-h">${icon('Calendar')}Past El Niño events</h2><ul>${p.history.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
  ${(p.cautions||[]).length?`<section class="p-block p-caution"><h2 class="p-h">${icon('Alert')}Cautions and data gaps</h2><ul>${p.cautions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
  ${(p.wiki_notes||[]).length?`<section class="p-block"><h2 class="p-h">${icon('Document')}Wiki notes</h2><div class="p-notes">${p.wiki_notes.map(n=>`<a class="chip-n" href="${WIKI+n}">${esc(n)}</a>`).join('')}</div></section>`:''}
</div></div>`;
$('#p-print').onclick=()=>window.print();
initMap();

/* previous / next profile */
const i=LIST.findIndex(x=>x.iso===p.iso), prev=LIST[(i-1+LIST.length)%LIST.length], next=LIST[(i+1)%LIST.length];
$('#pager').innerHTML=`<a href="${prev.file}"><small>← Previous profile</small>${esc(prev.name)}</a><a class="nx" href="${next.file}"><small>Next profile →</small>${esc(next.name)}</a>`;
</script>
